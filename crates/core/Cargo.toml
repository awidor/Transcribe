[package]
name = "transcribe-core"
version = "0.1.4"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
cpal = "0.16"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
futures-util = "0.3"
rubato = "0.16"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "xinput"] }
clipboard-rs = "0.3.5"
zbus = { version = "5", features = ["tokio"] }
evdev = "0.13.2"
wl-clipboard-rs = "0.9.3"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[build-dependencies]
cc = "1"
