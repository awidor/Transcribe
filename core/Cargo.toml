[package]
name = "transcribe-core"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = { version = "0.18.2", features = ["pulseaudio"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query"] }
rubato = "5"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "wav", "pcm", "id3v2"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
velopack = "1.2.161"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Com", "Win32_Globalization"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9.5"
x11rb = { version = "0.13", features = ["xtest", "xinput"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
