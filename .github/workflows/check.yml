name: Check

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check when called by the release workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  format:
    name: Format
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends clang-format git ca-certificates
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' ':!src-tauri')
          clang-format --dry-run -Werror $files

  linux:
    name: Check (Linux)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # The GNOME libraries the shell needs are newer than any hosted runner image.
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build g++ pkg-config \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev nlohmann-json3-dev libarchive-dev libsoxr-dev \
            libminiaudio-dev libglib2.0-dev libgio-2.0-dev-bin libevdev-dev libxcb1-dev libxcb-xinput-dev \
            libxcb-xtest0-dev libx11-dev libwayland-dev libwayland-bin libgtest-dev libgtkmm-4.0-dev \
            libadwaita-1-dev libgtk4-layer-shell-dev libayatana-appindicator-glib-dev
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: cmake -S . -B build -G Ninja -DTRANSCRIBE_SANITIZE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  windows:
    name: Check (Windows)
    timeout-minutes: 60
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-
      # Ninja with -k 0 reports every compile error in one run; MSBuild stops at the first failed library.
      - name: Build and test
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build -- -k 0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild shells\windows\Transcribe.vcxproj /restore /m /v:minimal /p:Configuration=Release /p:Platform=x64
      - name: Launch
        run: |
          $app = Start-Process build\windows\Release\Transcribe.exe -PassThru
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $shot.Save("screenshots\launch.png")
          if ($app.HasExited) { throw "Transcribe exited with code $($app.ExitCode)" }
          Stop-Process $app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: screenshots
          if-no-files-found: ignore
