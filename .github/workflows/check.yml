name: Check

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check when called by the release workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Check (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: check-${{ matrix.os }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libgtk-3-dev libgtk-layer-shell-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm run test:macos-hotkeys && npm run test:macos-permissions
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
