name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Check tag and project version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit('Use a stable version tag such as v0.1.0.')
          version = re.search(r'project\(Transcribe VERSION (\S+)', Path('CMakeLists.txt').read_text())[1]
          if version != tag[1:]:
              raise SystemExit(f'CMakeLists.txt: version {version} does not match {tag}')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\nsha={sha}\n')
          print(f'Validated {tag} at {sha}')
          PY

  check:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  windows:
    name: Installer (Windows)
    needs: [validate, check]
    timeout-minutes: 60
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-
      - name: Build
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild shells\windows\Transcribe.vcxproj /restore /m /v:minimal /p:Configuration=Release /p:Platform=x64
      - name: Package
        run: |
          dotnet tool install -g vpk --version 1.2.161
          & "$env:USERPROFILE\.dotnet\tools\vpk.exe" pack --packId Transcribe --packVersion ${{ needs.validate.outputs.version }} --packTitle Transcribe `
            --packDir build\windows\Release --mainExe Transcribe.exe --icon assets\icons\icon.ico --outputDir releases
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: releases
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Packages (Linux)
    needs: [validate, check]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # The GNOME libraries the shell needs are newer than any hosted runner image.
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build g++ pkg-config \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev nlohmann-json3-dev libarchive-dev libsoxr-dev \
            libminiaudio-dev libglib2.0-dev libgio-2.0-dev-bin libevdev-dev libxcb1-dev libxcb-xinput-dev \
            libxcb-xtest0-dev libx11-dev libwayland-dev libwayland-bin libgtkmm-4.0-dev \
            libadwaita-1-dev libgtk4-layer-shell-dev libayatana-appindicator-glib-dev \
            dpkg-dev file rpm squashfs-tools dotnet-sdk-10.0
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build
      - name: Package
        run: |
          (cd build && cpack)
          mkdir -p releases appdir
          mv build/*.deb build/*.rpm releases/
          cp build/shells/gnome/transcribe appdir/
          strip appdir/transcribe
          cp -r build/shells/gnome/icons appdir/
          dotnet tool install -g vpk --version 1.2.161
          ~/.dotnet/tools/vpk pack --packId Transcribe --packVersion ${{ needs.validate.outputs.version }} \
            --packTitle Transcribe --packDir appdir --mainExe transcribe --icon assets/icons/512.png \
            --outputDir releases
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: releases
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    needs: [validate, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [[ "$(cat release-state.txt)" != 'true' ]]; then
              echo '::error::This release is already published. Use a new version tag.'
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            cat > release-notes.md <<'NOTES'
          Install Transcribe using the appropriate download:

          - Windows (x64): `Transcribe-win-Setup.exe`.
          - Linux (x64): the `.deb` or `.rpm` package, or `Transcribe.AppImage`.

          SHA-256 checksums are included in `SHA256SUMS.txt`.
          Copies installed with the Windows setup or run as the AppImage update themselves once this
          release is published.

          The Windows installer is unsigned.
          NOTES
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --draft --title "Transcribe $RELEASE_TAG" \
              --notes-file release-notes.md --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json url --jq '"Draft release: " + .url' >> "$GITHUB_STEP_SUMMARY"
