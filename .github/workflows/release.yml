name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Check tag and project version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit('Use a stable version tag such as v0.1.0.')
          import tomllib
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if version != tag[1:]:
              raise SystemExit(f'Cargo.toml: version {version} does not match {tag}')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\nsha={sha}\n')
          print(f'Validated {tag} at {sha}')
          PY

  check:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  windows:
    name: Installer (Windows)
    needs: [validate, check]
    timeout-minutes: 60
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p transcribe
      - name: Package
        run: |
          New-Item -ItemType Directory -Force pack | Out-Null
          Copy-Item target\release\transcribe.exe pack\Transcribe.exe
          dotnet tool install -g vpk --version 1.2.161
          & "$env:USERPROFILE\.dotnet\tools\vpk.exe" pack --packId Transcribe --packVersion ${{ needs.validate.outputs.version }} --packTitle Transcribe `
            --packDir pack --mainExe Transcribe.exe --icon assets\icons\icon.ico --outputDir releases
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: releases
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Packages (Linux)
    needs: [validate, check]
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake clang \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev libzstd-dev squashfs-tools
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p transcribe
      - name: Package
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          mkdir -p releases appdir
          cargo deb --no-build -p transcribe --output releases/
          cargo generate-rpm -p app --output releases/
          cp target/release/transcribe appdir/
          dotnet tool install -g vpk --version 1.2.161
          ~/.dotnet/tools/vpk pack --packId Transcribe --packVersion ${{ needs.validate.outputs.version }} \
            --packTitle Transcribe --packDir appdir --mainExe transcribe --icon assets/icons/512.png \
            --outputDir releases
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: releases
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    needs: [validate, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [[ "$(cat release-state.txt)" != 'true' ]]; then
              echo '::error::This release is already published. Use a new version tag.'
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            cat > release-notes.md <<'NOTES'
          Install Transcribe using the appropriate download:

          - Windows (x64): `Transcribe-win-Setup.exe`.
          - Linux (x64): the `.deb` or `.rpm` package, or `Transcribe.AppImage`.

          SHA-256 checksums are included in `SHA256SUMS.txt`.
          Copies installed with the Windows setup or run as the AppImage update themselves once this
          release is published.

          The Windows installer is unsigned.
          NOTES
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --draft --title "Transcribe $RELEASE_TAG" \
              --notes-file release-notes.md --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json url --jq '"Draft release: " + .url' >> "$GITHUB_STEP_SUMMARY"
